
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — BALVI</title>
<style>
:root{--red:#f01422}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.top{height:64px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:10}
.logo{font-weight:1000;font-size:30px;letter-spacing:5px}
.v{color:var(--red)}
nav{display:flex;gap:22px;font-size:12px;font-weight:800;text-transform:uppercase}
.icon{border:0;background:none;font-size:21px}
.badge{background:var(--red);color:#fff;border-radius:50%;font-size:10px;padding:3px 5px}
.layout{max-width:1100px;margin:35px auto;padding:0 20px;display:grid;grid-template-columns:1.05fr .95fr;gap:40px}
.mainimg{width:100%;height:min(70vh,650px);object-fit:contain;background:#f7f7f7;cursor:zoom-in}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs img{width:75px;height:85px;object-fit:contain;background:#f5f5f5;border:1px solid #ddd;cursor:pointer}
.eyebrow{color:var(--red);font-size:11px;letter-spacing:2px;font-weight:900}
.details h1{font-size:34px;margin:8px 0}
.price{font-weight:900;font-size:19px;margin:14px 0}
.old-price{text-decoration:line-through;color:#888;font-size:14px;margin-left:8px}
.muted{font-size:12px;color:#666;line-height:1.7}
.label{font-size:11px;font-weight:900;letter-spacing:1px;margin:24px 0 10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{border:1px solid #ccc;background:#fff;padding:6px 10px;font-size:11px}
.swatch.active{border:2px solid var(--red)}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{border:1px solid #ccc;background:white;min-width:42px;padding:10px}
.size.active{background:#111;color:#fff;border-color:#111}
.quantity{display:flex;align-items:center;gap:18px}
.quantity button{border:1px solid #ddd;background:white;width:34px;height:34px}
.action{display:grid;gap:10px;margin-top:22px}
.add,.checkout{width:100%;padding:16px;border:0;color:#fff;font-weight:900}
.add{background:var(--red)}
.checkout{background:#111}
.back{display:inline-block;font-size:12px;font-weight:900;margin:15px 20px}
.zoom{display:none;position:fixed;inset:0;background:#000e;z-index:30;align-items:center;justify-content:center;padding:20px}
.zoom.open{display:flex}
.zoom img{max-width:95vw;max-height:90vh;object-fit:contain}
.zoom button{position:absolute;right:20px;top:15px;color:#fff;background:none;border:0;font-size:40px}
.notice{font-size:12px;color:#b00;margin-top:12px}
.loading{padding:30px 0;font-size:13px;color:#666}
@media(max-width:720px){
.layout{grid-template-columns:1fr;gap:25px;margin-top:15px}
.mainimg{height:55vh}
.details h1{font-size:29px}
.top{padding:0 12px}
.logo{font-size:23px;letter-spacing:3px}
nav{gap:10px;font-size:9px}
}
</style>
</head>
<body>

<header class="top">
<a href="index.html" class="logo">BAL<span class="v">V</span>I</a>
<nav>
<a href="index.html">Home</a>
<a href="index.html#shop">Shop</a>
<a href="index.html#about">About</a>
</nav>
<button class="icon" onclick="location.href='index.html'">
Bag <span class="badge" id="count">0</span>
</button>
</header>

<a class="back" href="index.html#shop">← BACK TO SHOP</a>

<div id="loading" class="loading" style="text-align:center">Loading product...</div>

<main class="layout" id="productLayout" style="display:none">
<section>
<img id="mainImage" class="mainimg" alt="Product image" onclick="openZoom()">
<div class="thumbs" id="thumbs"></div>
</section>

<section class="details">
<div class="eyebrow" id="categoryLabel">BALVI / COLLECTION</div>
<h1 id="name">Product</h1>
<div class="price" id="price"></div>

<p class="muted">
Streetwear for those who move differently. Choose your color and size,
then add it to your bag. Cash on delivery available.
</p>

<div class="label">COLOR: <span id="colorLabel"></span></div>
<div class="swatches" id="swatches"></div>

<div class="label">SELECT SIZE</div>
<div class="sizes" id="sizes"></div>

<div class="label">QUANTITY</div>
<div class="quantity">
<button onclick="setQty(-1)">−</button>
<strong id="qty">1</strong>
<button onclick="setQty(1)">+</button>
</div>

<div class="action">
<button class="add" id="addButton" onclick="addToCart(false)">
ADD TO BAG — <span id="buttonPrice"></span>
</button>
<button class="checkout" id="checkoutButton" onclick="addToCart(true)">
CHECKOUT →
</button>
</div>

<div class="notice" id="notice" role="status"></div>
<p class="muted">Shipping: EGP 80 · Payment: Cash on delivery</p>
</section>
</main>

<div class="zoom" id="zoom" onclick="if(event.target===this)closeZoom()">
<button onclick="closeZoom()">×</button>
<img id="zoomImage" alt="Zoomed product">
</div>

<script>
const money = n => "EGP " + Number(n).toLocaleString("en-US");

const oldProductImages = {
 "1": [
  {name:"Black",hex:"#111",image:"Black_esstnials.JPG"},
  {name:"Gray",hex:"#b9b9b9",image:"Gray_essential.JPG"}
 ],
 "2": [
  {name:"Black",hex:"#111",image:"Black_jacket.JPG"},
  {name:"Gray",hex:"#b9b9b9",image:"Gray_jacket.JPG"}
 ],
 "3": [
  {name:"Black",hex:"#111",image:"Black_superme.JPG"},
  {name:"Gray",hex:"#b9b9b9",image:"Gray_superme.JPG"}
 ],
 "4": [
  {name:"Blue",hex:"#183b78",image:"Blue_scuffer.JPG"},
  {name:"White",hex:"#fff",image:"White_scuffer.JPG"}
 ],
 "5": [
  {name:"British",hex:"#182746",image:"British.JPG"}
 ]
};

const sizeOptions = ["S","M","L","XL","XXL"];
const requestedId = new URLSearchParams(location.search).get("id") || "1";

let catalog = [];
let product = null;
let colorIndex = 0;
let size = "";
let qty = 1;

function safeImage(value) {
 if (typeof value !== "string" || !value.trim()) return "";
 const image = value.trim();
 if (image.includes("..") || image.startsWith("//")) return "";
 if (/^(https?:\/\/|\/|\.\/|[a-zA-Z0-9_-])/.test(image)) return image;
 return "";
}

function normalizeProduct(raw) {
 const id = String(raw.id);
 const fallbackColors = oldProductImages[id] || [];

 let sourceColors = Array.isArray(raw.colors) ? raw.colors : [];

 let colors = sourceColors.map((item, index) => {
  const obj = typeof item === "string" ? {name:item} : (item || {});
  const fallback = fallbackColors.find(c => c.name === obj.name)
    || fallbackColors[index]
    || {};

  return {
   name: String(obj.name || obj.color || ("Color " + (index + 1))),
   hex: String(obj.hex || fallback.hex || "#cccccc"),
   image: safeImage(obj.image || obj.img || fallback.image || raw.image)
  };
 });

 if (!colors.length && fallbackColors.length) {
  colors = fallbackColors.map(c => ({...c}));
 }

 return {
  id,
  name: String(raw.name || "BALVI Product"),
  category: String(raw.category || "hoodies").toLowerCase(),
  price: Number(raw.price),
  sale_price: raw.sale_price == null ? null : Number(raw.sale_price),
  image: safeImage(raw.image),
  colors
 };
}

function currentPrice() {
 if (product.sale_price !== null &&
     Number.isFinite(product.sale_price) &&
     product.sale_price >= 0 &&
     product.sale_price < product.price) {
  return product.sale_price;
 }
 return product.price;
}

function categoryName(category) {
 const names = {
  "hoodies":"HOODIES",
  "crewnecks":"CREWNECKS",
  "zip-ups":"ZIP-UPS"
 };
 return names[category] || "COLLECTION";
}

function setImage(img, src, fallback) {
 img.onerror = null;
 img.src = src || fallback || "";
 img.onerror = function() {
  if (fallback && this.src !== new URL(fallback, location.href).href) {
   this.onerror = null;
   this.src = fallback;
  } else {
   this.onerror = null;
   this.alt = "Image unavailable";
  }
 };
}

function render() {
 if (!product) return;

 document.title = product.name + " — BALVI";
 document.getElementById("name").textContent = product.name;
 document.getElementById("categoryLabel").textContent =
  "BALVI / " + categoryName(product.category);
 document.getElementById("colorLabel").textContent =
  product.colors[colorIndex]?.name || "Default";
 document.getElementById("qty").textContent = qty;

 const activePrice = currentPrice();
 const priceEl = document.getElementById("price");
 priceEl.replaceChildren();

 const current = document.createElement("span");
 current.textContent = money(activePrice);
 priceEl.appendChild(current);

 if (activePrice < product.price) {
  const old = document.createElement("span");
  old.className = "old-price";
  old.textContent = money(product.price);
  priceEl.appendChild(old);
 }

 document.getElementById("buttonPrice").textContent = money(activePrice * qty);

 const selectedColor = product.colors[colorIndex] || {};
 const mainImage = document.getElementById("mainImage");
 const selectedImage = safeImage(selectedColor.image || product.image);

 setImage(mainImage, selectedImage, "");

 const zoomImage = document.getElementById("zoomImage");
 setImage(zoomImage, selectedImage, "");

 const thumbs = document.getElementById("thumbs");
 thumbs.replaceChildren();

 product.colors.forEach((color, index) => {
  if (!color.image) return;
  const img = document.createElement("img");
  img.src = color.image;
  img.alt = color.name;
  img.onerror = function(){this.style.display="none";};
  img.addEventListener("click", () => chooseColor(index));
  thumbs.appendChild(img);
 });

 const swatches = document.getElementById("swatches");
 swatches.replaceChildren();

 product.colors.forEach((color, index) => {
  const button = document.createElement("button");
  button.className = "swatch" + (index === colorIndex ? " active" : "");
  const dot = document.createElement("span");
  dot.style.cssText =
   "display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:6px;border:1px solid #bbb";
  dot.style.background = color.hex || "#ccc";
  button.append(dot, document.createTextNode(color.name));
  button.addEventListener("click", () => chooseColor(index));
  swatches.appendChild(button);
 });

 const sizes = document.getElementById("sizes");
 sizes.replaceChildren();

 sizeOptions.forEach(s => {
  const button = document.createElement("button");
  button.className = "size" + (size === s ? " active" : "");
  button.textContent = s;
  button.addEventListener("click", () => chooseSize(s));
  sizes.appendChild(button);
 });
}

function chooseColor(index) {
 colorIndex = index;
 render();
}

function chooseSize(value) {
 size = value;
 render();
}

function setQty(change) {
 qty = Math.max(1, Math.min(20, qty + change));
 render();
}

function openZoom() {
 if (product) document.getElementById("zoom").classList.add("open");
}

function closeZoom() {
 document.getElementById("zoom").classList.remove("open");
}

function updateCartCount() {
 try {
  const cart = JSON.parse(localStorage.getItem("balvi-cart") || "[]");
  document.getElementById("count").textContent =
   cart.reduce((sum, item) => sum + Math.max(0, Number(item.quantity) || 0), 0);
 } catch {
  document.getElementById("count").textContent = "0";
 }
}

function addToCart(goCheckout = false) {
 const notice = document.getElementById("notice");

 if (!size) {
  notice.textContent = "Please select a size first.";
  notice.style.color = "#b00";
  return;
 }

 if (!product || !Number.isFinite(currentPrice())) {
  notice.textContent = "This product is currently unavailable.";
  notice.style.color = "#b00";
  return;
 }

 const color = product.colors[colorIndex] || {name:"Default",image:product.image};
 const key = `${product.id}-${color.name}-${size}`;

 try {
  const cart = JSON.parse(localStorage.getItem("balvi-cart") || "[]");
  const found = cart.find(item => item.key === key);

  if (found) {
   found.quantity = Math.min(99, (Number(found.quantity) || 0) + qty);
   found.price = currentPrice();
   found.name = product.name;
   found.image = color.image || product.image;
  } else {
   cart.push({
    key,
    id: product.id,
    name: product.name,
    price: currentPrice(),
    color: color.name,
    size,
    quantity: qty,
    image: color.image || product.image
   });
  }

  localStorage.setItem("balvi-cart", JSON.stringify(cart));
  updateCartCount();

  notice.textContent = "Added to your bag.";
  notice.style.color = "#087b35";

  if (goCheckout) {
   location.href = "index.html?checkout=1";
  }
 } catch {
  notice.textContent = "Could not update your bag. Please try again.";
  notice.style.color = "#b00";
 }
}

async function loadProduct() {
 const loading = document.getElementById("loading");
 const layout = document.getElementById("productLayout");

 try {
  const response = await fetch("/api/products", {
   method:"GET",
   headers:{"Accept":"application/json"},
   cache:"no-store"
  });

  if (!response.ok) throw new Error("Products request failed");

  const data = await response.json();
  if (!data.success || !Array.isArray(data.products)) {
   throw new Error("Invalid products response");
  }

  catalog = data.products
   .map(normalizeProduct)
   .filter(p => p.id && p.name && Number.isFinite(p.price) && p.price >= 0);

  product = catalog.find(p => p.id === String(requestedId));

  if (!product) {
   loading.textContent = "Product not found. Please return to the shop.";
   return;
  }

  if (!product.colors.length) {
   product.colors = [{name:"Default",hex:"#ccc",image:product.image}];
  }

  colorIndex = 0;
  loading.style.display = "none";
  layout.style.display = "grid";
  render();
 } catch (error) {
  console.error("Could not load product:", error);
  loading.textContent =
   "Could not load this product. Please refresh the page or return to the shop.";
 }
}

updateCartCount();
loadProduct();
</script>
</body>
</html>
