<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — BALVI</title>
<style>
:root{--red:#f01422}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.top{height:64px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:10}.logo{font-weight:1000;font-size:30px;letter-spacing:5px}.v{color:var(--red)}nav{display:flex;gap:22px;font-size:12px;font-weight:800;text-transform:uppercase}.icon{border:0;background:none;font-size:21px}.badge{background:var(--red);color:#fff;border-radius:50%;font-size:10px;padding:3px 5px}.layout{max-width:1100px;margin:35px auto;padding:0 20px;display:grid;grid-template-columns:1.05fr .95fr;gap:40px}.mainimg{width:100%;height:min(70vh,650px);object-fit:contain;background:#f7f7f7;cursor:zoom-in}.thumbs{display:flex;gap:10px;margin-top:12px}.thumbs img{width:75px;height:85px;object-fit:contain;background:#f5f5f5;border:1px solid #ddd;cursor:pointer}.eyebrow{color:var(--red);font-size:11px;letter-spacing:2px;font-weight:900}.details h1{font-size:34px;margin:8px 0}.price{font-weight:900;font-size:19px;margin:14px 0}.muted{font-size:12px;color:#666;line-height:1.7}.label{font-size:11px;font-weight:900;letter-spacing:1px;margin:24px 0 10px}.swatches{display:flex;gap:10px}.swatch{border:1px solid #ccc;background:#fff;padding:6px 10px;font-size:11px}.swatch.active{border:2px solid var(--red)}.sizes{display:flex;gap:8px;flex-wrap:wrap}.size{border:1px solid #ccc;background:white;min-width:42px;padding:10px}.size.active{background:#111;color:#fff;border-color:#111}.quantity{display:flex;align-items:center;gap:18px}.quantity button{border:1px solid #ddd;background:white;width:34px;height:34px}.add{width:100%;padding:16px;background:var(--red);border:0;color:white;font-weight:900;margin-top:25px}.back{display:inline-block;font-size:12px;font-weight:900;margin:15px 20px}.zoom{display:none;position:fixed;inset:0;background:#000e;z-index:30;align-items:center;justify-content:center;padding:20px}.zoom.open{display:flex}.zoom img{max-width:95vw;max-height:90vh;object-fit:contain}.zoom button{position:absolute;right:20px;top:15px;color:#fff;background:none;border:0;font-size:40px}.notice{font-size:12px;color:#b00;margin-top:12px}.action{display:grid;gap:10px;margin-top:22px}.add,.checkout{width:100%;padding:16px;border:0;color:#fff;font-weight:900}.add{background:var(--red)}.checkout{background:#111}@media(max-width:720px){.layout{grid-template-columns:1fr;gap:25px;margin-top:15px}.mainimg{height:55vh}.details h1{font-size:29px}.top{padding:0 12px}.logo{font-size:23px;letter-spacing:3px}nav{gap:10px;font-size:9px}}
</style></head><body>
<header class="top"><a href="index.html" class="logo">BAL<span class="v">V</span>I</a><nav><a href="index.html">Home</a><a href="index.html#shop">Hoodies</a><a href="index.html#about">About</a></nav><button class="icon" onclick="location.href='index.html'">Bag <span class="badge" id="count">0</span></button></header><a class="back" href="index.html#shop">← BACK TO HOODIES</a>
<main class="layout"><section><img id="mainImage" class="mainimg" alt="Product image" onclick="openZoom()"><div class="thumbs" id="thumbs"></div></section><section class="details"><div class="eyebrow">BALVI / HOODIE DROP</div><h1 id="name">Hoodie</h1><div class="price" id="price"></div><p class="muted">Streetwear for those who move differently. Choose your color and size, then add it to your bag. Cash on delivery available.</p><div class="label">COLOR: <span id="colorLabel"></span></div><div class="swatches" id="swatches"></div><div class="label">SELECT SIZE</div><div class="sizes" id="sizes"></div><div class="label">QUANTITY</div><div class="quantity"><button onclick="setQty(-1)">−</button><strong id="qty">1</strong><button onclick="setQty(1)">+</button></div><div class="action"><button class="add" onclick="addToCart(false)">ADD TO BAG — <span id="buttonPrice"></span></button><button class="checkout" onclick="addToCart(true)">CHECKOUT →</button></div><div class="notice" id="notice"></div><p class="muted">Shipping: EGP 80 · Payment: Cash on delivery</p></section></main>
<div class="zoom" id="zoom" onclick="if(event.target===this)closeZoom()"><button onclick="closeZoom()">×</button><img id="zoomImage" alt="Zoomed product"></div>
<script>
const catalog=[
{id:1,name:"Essentials Hoodie",price:650,colors:[{name:"Black",hex:"#111",image:"Black_esstnials.JPG"},{name:"Gray",hex:"#b9b9b9",image:"Gray_essential.JPG"}]},
{id:2,name:"Jacket Hoodie",price:750,colors:[{name:"Black",hex:"#111",image:"Black_jacket.JPG"},{name:"Gray",hex:"#b9b9b9",image:"Gray_jacket.JPG"}]},
{id:3,name:"Supreme Hoodie",price:650,colors:[{name:"Black",hex:"#111",image:"Black_superme.JPG"},{name:"Gray",hex:"#b9b9b9",image:"Gray_superme.JPG"}]},
{id:4,name:"Scuffer Hoodie",price:650,colors:[{name:"Blue",hex:"#183b78",image:"Blue_scuffer.JPG"},{name:"White",hex:"#fff",image:"White_scuffer.JPG"}]},
{id:5,name:"British Hoodie",price:650,colors:[{name:"British",hex:"#182746",image:"British.JPG"}]}
];const id=Number(new URLSearchParams(location.search).get("id")||1),product=catalog.find(p=>p.id===id)||catalog[0];let colorIndex=0,size="",qty=1;const money=n=>"EGP "+Number(n).toLocaleString("en-US");const image=()=>product.colors[colorIndex].image;
function render(){document.title=product.name+" — BALVI";document.getElementById("name").textContent=product.name;document.getElementById("price").textContent=money(product.price);document.getElementById("buttonPrice").textContent=money(product.price*qty);document.getElementById("qty").textContent=qty;document.getElementById("colorLabel").textContent=product.colors[colorIndex].name;document.getElementById("mainImage").onerror=function(){if(product.id===1&&colorIndex===0&&!this.dataset.fallback){this.dataset.fallback="1";this.src="Black_essentials.JPG"}else{this.onerror=null;this.alt="Image unavailable: check the exact filename on GitHub"}};document.getElementById("mainImage").src=image();document.getElementById("zoomImage").src=image();document.getElementById("thumbs").innerHTML=product.colors.map((c,i)=>`<img src="${c.image}" alt="${c.name}" onclick="chooseColor(${i})">`).join("");document.getElementById("swatches").innerHTML=product.colors.map((c,i)=>`<button class="swatch ${i===colorIndex?'active':''}" onclick="chooseColor(${i})"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:6px;background:${c.hex};border:1px solid #bbb"></span>${c.name}</button>`).join("");document.getElementById("sizes").innerHTML=["S","M","L","XL","XXL"].map(s=>`<button class="size ${size===s?'active':''}" onclick="chooseSize('${s}')">${s}</button>`).join("");}
function chooseColor(i){colorIndex=i;render()}function chooseSize(s){size=s;render()}function setQty(n){qty=Math.max(1,Math.min(20,qty+n));render()}function openZoom(){document.getElementById("zoom").classList.add("open")}function closeZoom(){document.getElementById("zoom").classList.remove("open")}
function addToCart(goCheckout=false){const notice=document.getElementById("notice");if(!size){notice.textContent="Please select a size first.";notice.style.color="#b00";return}let cart=JSON.parse(localStorage.getItem("balvi-cart")||"[]"),c=product.colors[colorIndex],key=`${product.id}-${c.name}-${size}`,found=cart.find(i=>i.key===key);if(found)found.quantity+=qty;else cart.push({key,id:product.id,name:product.name,price:product.price,color:c.name,size,quantity:qty,image:c.image});localStorage.setItem("balvi-cart",JSON.stringify(cart));notice.textContent="Added to your bag.";notice.style.color="#087b35";if(goCheckout){location.href="index.html?checkout=1";return}}document.getElementById("count").textContent=JSON.parse(localStorage.getItem("balvi-cart")||"[]").reduce((s,i)=>s+i.quantity,0);render();
</script></body></html>
