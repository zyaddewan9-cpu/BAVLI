
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BALVI — Track Order</title>
<style>
:root{--red:#f01422;--black:#111;--line:#e9e9e9}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--black);background:#fff}
.top{height:64px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}
.logo{font-weight:1000;font-size:30px;letter-spacing:5px;text-decoration:none;color:#111}
.v{color:var(--red)}
.top a:last-child{font-size:12px;font-weight:800;text-decoration:none}
main{max-width:650px;margin:55px auto;padding:0 20px}
.kicker{color:var(--red);font-size:11px;letter-spacing:3px;font-weight:900}
h1{font-size:clamp(32px,7vw,48px);margin:12px 0}
.intro{color:#666;font-size:14px;line-height:1.7}
.card{border:1px solid var(--line);padding:24px;margin-top:28px}
.label{font-size:10px;letter-spacing:2px;font-weight:900;color:#777}
.status{font-size:25px;font-weight:900;margin:10px 0;color:var(--red)}
.steps{margin-top:28px}
.step{display:flex;gap:14px;position:relative;padding-bottom:25px}
.dot{width:24px;height:24px;flex:0 0 24px;border:2px solid #ddd;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#fff;z-index:1}
.step.done .dot{background:var(--red);border-color:var(--red);color:white}
.step strong{font-size:14px}
.step p{margin:5px 0 0;color:#777;font-size:12px;line-height:1.5}
.step:not(:last-child):before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#e5e5e5}
.step.done:not(:last-child):before{background:var(--red)}
.notice{padding:14px;background:#fff1f1;color:#900;font-size:13px;line-height:1.6}
.muted{color:#777;font-size:12px;line-height:1.6}
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;padding:14px 20px;font-size:11px;font-weight:900;margin-top:18px}
footer{text-align:center;border-top:1px solid #eee;padding:22px;color:#777;font-size:10px;margin-top:55px}
@media(max-width:500px){.top{padding:0 16px}.logo{font-size:24px}main{margin:35px auto}.card{padding:18px}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html" class="logo">BAL<span class="v">V</span>I</a>
  <a href="index.html">BACK TO SHOP →</a>
</header>

<main>
  <div class="kicker">BALVI / ORDER TRACKING</div>
  <h1>TRACK YOUR ORDER.</h1>
  <p class="intro">Follow your order status here. Your order's latest update will appear below.</p>

  <section class="card" id="result" aria-live="polite">
    <p class="muted">Checking your order...</p>
  </section>

  <a class="btn" href="index.html">CONTINUE SHOPPING →</a>
</main>

<footer>© 2026 BALVI. ALL RIGHTS RESERVED.</footer>

<script>
const statusList = [
  "Order Received",
  "Confirmed",
  "Shipped",
  "Delivered",
  "Cancelled"
];

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function showError(message) {
  document.getElementById("result").innerHTML =
    '<div class="notice">' + escapeHTML(message) + '</div>' +
    '<p class="muted">Check that you opened the complete tracking link from your order confirmation.</p>';
}

async function loadOrder() {
  const token = new URLSearchParams(location.search).get("token");

  if (!token || !/^[a-f0-9]{48}$/.test(token)) {
    showError("The tracking link is missing or invalid.");
    return;
  }

  try {
    const response = await fetch(
      "/api/orders?token=" + encodeURIComponent(token)
    );
    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.success || !data.order) {
      throw new Error(data.message || "We couldn't find this order.");
    }

    const order = data.order;
    const status = order.status;

    if (!statusList.includes(status)) {
      throw new Error("This order has an unknown status.");
    }

    const cancelled = status === "Cancelled";
    const currentIndex = statusList.indexOf(status);

    const steps = statusList.map((item, index) => {
      if (item === "Cancelled") return "";
      const done = !cancelled && currentIndex >= index;
      return `
        <div class="step ${done ? "done" : ""}">
          <div class="dot">${done ? "✓" : ""}</div>
          <div>
            <strong>${item}</strong>
            <p>${item === status ? "Current order status" :
              done ? "Completed" : "Waiting for update"}</p>
          </div>
        </div>`;
    }).join("");

    document.getElementById("result").innerHTML = `
      <div class="label">ORDER NUMBER</div>
      <div style="font-size:18px;font-weight:900;margin:8px 0 22px">
        #${escapeHTML(order.id)}
      </div>
      <div class="label">CURRENT STATUS</div>
      <div class="status">${escapeHTML(status)}</div>
      <p class="muted">Placed: ${order.created_at
        ? escapeHTML(new Date(order.created_at).toLocaleString())
        : "Date unavailable"}</p>
      ${cancelled ? '<div class="notice">This order has been cancelled. Please contact the store if you need help.</div>' :
        '<div class="steps">' + steps + '</div>'}
    `;
  } catch (error) {
    showError(error.message || "Something went wrong. Please try again.");
  }
}

loadOrder();
</script>
</body>
</html>
