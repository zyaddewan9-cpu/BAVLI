
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BALVI — Track Order</title>
<style>
:root{--red:#f01422;--black:#111;--line:#e9e9e9}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--black);background:#fff}
.top{height:64px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}
.logo{font-weight:1000;font-size:30px;letter-spacing:5px;text-decoration:none;color:#111}
.v{color:var(--red)}
.top a:last-child{font-size:12px;font-weight:800;text-decoration:none;color:#111}
main{max-width:650px;margin:55px auto;padding:0 20px}
.kicker{color:var(--red);font-size:11px;letter-spacing:3px;font-weight:900}
h1{font-size:clamp(32px,7vw,48px);margin:12px 0}
.intro{color:#666;font-size:14px;line-height:1.7}
.card{border:1px solid var(--line);padding:24px;margin-top:28px}
.label{display:block;font-size:10px;letter-spacing:2px;font-weight:900;color:#777;margin-bottom:10px}
.input{display:block;width:100%;padding:15px;border:1px solid #ddd;font-size:14px;outline:none;margin-bottom:12px}
.input:focus{border-color:var(--red)}
.btn{display:inline-block;border:0;background:var(--red);color:#fff;text-decoration:none;padding:14px 20px;font-size:11px;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.track-form .btn{width:100%}
.status{font-size:25px;font-weight:900;margin:10px 0;color:var(--red)}
.steps{margin-top:28px}
.step{display:flex;gap:14px;position:relative;padding-bottom:25px}
.dot{width:24px;height:24px;flex:0 0 24px;border:2px solid #ddd;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#fff;z-index:1}
.step.done .dot{background:var(--red);border-color:var(--red);color:white}
.step strong{font-size:14px}
.step p{margin:5px 0 0;color:#777;font-size:12px;line-height:1.5}
.step:not(:last-child):before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#e5e5e5}
.step.done:not(:last-child):before{background:var(--red)}
.notice{padding:14px;background:#fff1f1;color:#900;font-size:13px;line-height:1.6;margin-top:12px}
.muted{color:#777;font-size:12px;line-height:1.6}
.result-heading{font-size:12px;font-weight:900;letter-spacing:2px;color:#777}
footer{text-align:center;border-top:1px solid #eee;padding:22px;color:#777;font-size:10px;margin-top:55px}
@media(max-width:500px){.top{padding:0 16px}.logo{font-size:24px}main{margin:35px auto}.card{padding:18px}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html" class="logo">BAL<span class="v">V</span>I</a>
  <a href="index.html">BACK TO SHOP →</a>
</header>

<main>
  <div class="kicker">BALVI / ORDER TRACKING</div>
  <h1>TRACK YOUR ORDER.</h1>
  <p class="intro">Enter the tracking token from your order confirmation link to check your latest order status.</p>

  <section class="card">
    <form class="track-form" id="trackForm">
      <label class="label" for="trackingToken">TRACKING TOKEN</label>
      <input
        class="input"
        id="trackingToken"
        name="token"
        type="text"
        placeholder="Paste your tracking token here"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        required
      >
      <button class="btn" id="trackButton" type="submit">TRACK ORDER →</button>
    </form>

    <div id="result" aria-live="polite"></div>
  </section>

  <a class="btn" href="index.html" style="margin-top:18px">CONTINUE SHOPPING →</a>
</main>

<footer>© 2026 BALVI. ALL RIGHTS RESERVED.</footer>

<script>
const statusList = [
  "Order Received",
  "Confirmed",
  "Shipped",
  "Delivered",
  "Cancelled"
];

const form = document.getElementById("trackForm");
const input = document.getElementById("trackingToken");
const button = document.getElementById("trackButton");
const result = document.getElementById("result");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function showError(message) {
  result.innerHTML =
    '<div class="notice">' + escapeHTML(message) + '</div>';
}

async function loadOrder(token) {
  token = String(token || "").trim();

  if (!/^[a-f0-9]{48}$/i.test(token)) {
    showError("Please enter a valid tracking token. It should contain 48 hexadecimal characters.");
    return;
  }

  button.disabled = true;
  button.textContent = "CHECKING ORDER...";
  result.innerHTML = '<p class="muted">Checking your order...</p>';

  try {
    const response = await fetch(
      "/api/orders?token=" + encodeURIComponent(token),
      { headers: { "Accept": "application/json" } }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.success || !data.order) {
      throw new Error(data.message || data.error || "We couldn't find this order. Check your tracking token.");
    }

    const order = data.order;
    const status = order.status;

    if (!statusList.includes(status)) {
      throw new Error("This order has an unknown status. Please contact the store.");
    }

    const cancelled = status === "Cancelled";
    const currentIndex = statusList.indexOf(status);

    const steps = statusList
      .filter(item => item !== "Cancelled")
      .map((item, index) => {
        const done = !cancelled && currentIndex >= index;
        return `
          <div class="step ${done ? "done" : ""}">
            <div class="dot">${done ? "✓" : ""}</div>
            <div>
              <strong>${item}</strong>
              <p>${item === status ? "Current order status" :
                done ? "Completed" : "Waiting for update"}</p>
            </div>
          </div>`;
      }).join("");

    result.innerHTML = `
      <div style="border-top:1px solid #eee;margin-top:24px;padding-top:22px">
        <div class="result-heading">ORDER NUMBER</div>
        <div style="font-size:18px;font-weight:900;margin:8px 0 22px">
          #${escapeHTML(order.id)}
        </div>
        <div class="result-heading">CURRENT STATUS</div>
        <div class="status">${escapeHTML(status)}</div>
        <p class="muted">Placed: ${
          order.created_at
            ? escapeHTML(new Date(order.created_at).toLocaleString())
            : "Date unavailable"
        }</p>
        ${
          cancelled
            ? '<div class="notice">This order has been cancelled. Please contact the store if you need help.</div>'
            : '<div class="steps">' + steps + '</div>'
        }
        <button class="btn" id="refreshOrder" type="button">REFRESH STATUS ↻</button>
      </div>
    `;

    document.getElementById("refreshOrder").addEventListener("click", () => loadOrder(token));

    const url = new URL(window.location.href);
    url.searchParams.set("token", token);
    window.history.replaceState({}, "", url);
  } catch (error) {
    showError(error.message || "Something went wrong. Please try again.");
  } finally {
    button.disabled = false;
    button.textContent = "TRACK ORDER →";
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  loadOrder(input.value);
});

const urlToken = new URLSearchParams(window.location.search).get("token");
if (urlToken) {
  input.value = urlToken;
  loadOrder(urlToken);
}
</script>
</body>
</html>
